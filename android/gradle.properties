# Sized for an 8 GB RAM PC (the template default of 8G caused heavy swapping)
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Project is on F: but the pub cache is on C:, which breaks Kotlin incremental caches on Windows
kotlin.incremental=false
